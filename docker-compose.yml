name: ${PROJECT_NAME}

services:
  n8n:
    image: n8nio/n8n:2.39.0
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - N8N_RESTRICT_FILE_ACCESS_TO=/mnt/knowledge
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./knowledge:/mnt/knowledge:ro

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  n8n_data:
  qdrant_data:
